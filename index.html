<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VeganCheck – Barcode scannen, vegan oder nicht</title>
<meta name="description" content="Barcode scannen und sofort sehen, ob ein Produkt vegan ist. Wenn nicht vegan: ist es wenigstens vegetarisch? Für den deutschen Markt.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VeganCheck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://world.openfoodfacts.org" crossorigin>
<link rel="preconnect" href="https://images.openfoodfacts.org">
<meta property="og:title" content="VeganCheck – Barcode scannen, vegan oder nicht">
<meta property="og:description" content="Barcode scannen und sofort sehen: vegan, vegetarisch oder keins von beidem.">
<meta property="og:locale" content="de_DE">
<meta property="og:type" content="website">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="navbar" id="navbar">
  <span class="navbar-title" aria-hidden="true">VeganCheck</span>
</header>

<main>
  <div class="large-title">
    <h1>VeganCheck</h1>
    <button id="btn-info" class="circle-btn" type="button" aria-label="Info">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".9" class="fill"/></svg>
    </button>
  </div>

  <!-- Kamera -->
  <section class="camera" id="camera" aria-label="Barcode scannen">
    <video id="video" playsinline muted autoplay></video>
    <button id="btn-start" class="camera-idle" type="button">
      <span class="scan-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M7 15V10a3 3 0 0 1 3-3h5M33 7h5a3 3 0 0 1 3 3v5M41 33v5a3 3 0 0 1-3 3h-5M15 41h-5a3 3 0 0 1-3-3v-5"/><path d="M15 16v16M20 16v16M25 16v16M30 16v16M34 16v16" class="bars"/></svg>
      </span>
      <span class="camera-cta">Barcode scannen</span>
      <span id="cam-hint" class="camera-hint">Tippen, um die Kamera zu starten</span>
    </button>
    <div class="reticle" aria-hidden="true"><span class="sweep"></span></div>
    <div class="camera-tools">
      <button id="btn-torch" class="glass-btn" type="button" aria-label="Taschenlampe" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.3 2.5 5.2 13.1a.6.6 0 0 0 .5 1h5.1l-.9 7.4 8.1-10.6a.6.6 0 0 0-.5-1h-5.1z" class="fill"/></svg>
      </button>
      <button id="btn-stop" class="glass-btn" type="button" aria-label="Kamera beenden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>
  </section>

  <!-- Ein Feld für Nummer und Name -->
  <form id="query-form" class="searchfield" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"/><path d="m15.2 15.2 4.6 4.6"/></svg>
    <label class="sr-only" for="q">Barcode-Nummer oder Produktname</label>
    <input id="q" type="search" enterkeyhint="search" placeholder="Barcode-Nummer oder Produkt">
    <button id="btn-clear" class="clear" type="button" aria-label="Eingabe löschen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" class="fill"/><path d="m8.5 8.5 7 7m0-7-7 7" class="x"/></svg>
    </button>
  </form>

  <section id="search" class="group" aria-live="polite" hidden></section>

  <section id="home">
    <section id="recent-wrap" class="group" hidden>
      <div class="group-head">
        <h2>Zuletzt geprüft</h2>
        <button id="btn-all" class="link" type="button">Alle</button>
      </div>
      <ul id="recent" class="list"></ul>
    </section>

    <section class="group">
      <ul class="list">
        <li><button type="button" class="row" data-open="ingredients">
          <span class="row-icon ri-green"><svg viewBox="0 0 24 24"><path d="M6 6h12M6 10.5h12M6 15h7"/><circle cx="17.5" cy="17.5" r="2.8"/></svg></span>
          <span class="row-text"><span>Zutatenliste prüfen</span><small>Für Produkte ohne Eintrag – offline</small></span>
          <span class="chev"></span>
        </button></li>
      </ul>
    </section>
  </section>

  <footer>Daten von <a href="https://de.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> · Robert Krause</footer>
</main>

<!-- Ein Sheet für Ergebnis, Verlauf, Zutaten und Info -->
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-grabber" aria-hidden="true"></div>
  <div class="sheet-bar">
    <button id="sheet-back" class="glass-btn small" type="button" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    </button>
    <h2 id="sheet-title" class="sheet-title"></h2>
    <div class="sheet-actions" id="sheet-actions"></div>
    <button id="sheet-close" class="glass-btn small" type="button" aria-label="Schließen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="rules.js"></script>
<script src="verdict.js"></script>
<script src="app.js"></script>
</body>
</html>
